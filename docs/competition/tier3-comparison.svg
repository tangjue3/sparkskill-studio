<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 数据来源：BENCHMARK.md §4（Evaluator v2 最终结论，对冻结数据全量重评分） -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <rect x="24" y="20" width="912" height="520" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="48" y="58" font-size="22" font-weight="700" fill="#0f172a">Tier-3 对照评测：baseline vs with-skill（最终 v2）</text>
  <text x="48" y="82" font-size="13" fill="#475569">同一 Agent、同一冻结任务集（每侧 9 任务、单次运行），唯一核心变量为是否加载 SparkSkill Studio 三 Skill</text>

  <!-- 图例 -->
  <rect x="700" y="44" width="14" height="14" rx="3" fill="#94a3b8"/>
  <text x="720" y="56" font-size="12" fill="#334155">baseline（不加载 Skill，项目外隔离目录执行）</text>
  <rect x="700" y="66" width="14" height="14" rx="3" fill="#0d9488"/>
  <text x="720" y="78" font-size="12" fill="#334155">with-skill（加载三 Skill）</text>

  <!-- ============ 左：四维通过数（/9） ============ -->
  <text x="48" y="122" font-size="15" font-weight="700" fill="#0f172a">四维通过数（满分 9）</text>

  <!-- 网格：零线 y=380；9 分 = 222px -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="130" y1="150" x2="130" y2="380"/>
    <line x1="200" y1="150" x2="200" y2="380"/>
    <line x1="270" y1="150" x2="270" y2="380"/>
    <line x1="340" y1="150" x2="340" y2="380"/>
    <line x1="410" y1="150" x2="410" y2="380"/>
    <line x1="130" y1="380" x2="445" y2="380"/>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="130" y="396">0</text><text x="200" y="396">2</text><text x="270" y="396">4</text><text x="340" y="396">6</text><text x="410" y="396">8</text>
  </g>

  <!-- G1 Security: baseline 9 / skill 9 -->
  <rect x="146" y="158" width="24" height="222" fill="#94a3b8" rx="3"/>
  <rect x="176" y="158" width="24" height="222" fill="#0d9488" rx="3"/>
  <text x="158" y="150" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">9</text>
  <text x="188" y="150" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">9</text>
  <text x="173" y="412" font-size="12" fill="#0f172a" text-anchor="middle">Security</text>

  <!-- G2 Correctness: baseline 7 / skill 9 -->
  <rect x="226" y="207" width="24" height="173" fill="#94a3b8" rx="3"/>
  <rect x="256" y="158" width="24" height="222" fill="#0d9488" rx="3"/>
  <text x="238" y="199" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">7</text>
  <text x="268" y="150" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">9</text>
  <text x="253" y="412" font-size="12" fill="#0f172a" text-anchor="middle">Correctness</text>

  <!-- G3 Discoverability: baseline 5 / skill 9 -->
  <rect x="306" y="257" width="24" height="123" fill="#94a3b8" rx="3"/>
  <rect x="336" y="158" width="24" height="222" fill="#0d9488" rx="3"/>
  <text x="318" y="249" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">5</text>
  <text x="348" y="150" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">9</text>
  <text x="333" y="412" font-size="12" fill="#0f172a" text-anchor="middle">Discoverability</text>

  <!-- G4 Effectiveness: baseline 6 / skill 9 -->
  <rect x="386" y="232" width="24" height="148" fill="#94a3b8" rx="3"/>
  <rect x="416" y="158" width="24" height="222" fill="#0d9488" rx="3"/>
  <text x="398" y="224" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">6</text>
  <text x="428" y="150" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">9</text>
  <text x="413" y="412" font-size="12" fill="#0f172a" text-anchor="middle">Effectiveness</text>

  <!-- ============ 右：效率 ============ -->
  <text x="540" y="122" font-size="15" font-weight="700" fill="#0f172a">效率（数量指标，不抵消语义错误）</text>

  <!-- 总耗时 -->
  <text x="540" y="152" font-size="12" fill="#475569">总耗时（秒，越少越好）</text>
  <rect x="540" y="162" width="300" height="26" fill="#94a3b8" rx="4"/>
  <rect x="540" y="198" width="68" height="26" fill="#0d9488" rx="4"/>
  <text x="846" y="180" font-size="13" font-weight="700" fill="#334155">3534.4</text>
  <text x="616" y="216" font-size="13" font-weight="700" fill="#0f766e">800.5（−77.4%）</text>

  <!-- 工具调用 -->
  <text x="540" y="254" font-size="12" fill="#475569">工具调用次数</text>
  <rect x="540" y="264" width="200" height="26" fill="#94a3b8" rx="4"/>
  <rect x="540" y="300" width="108" height="26" fill="#0d9488" rx="4"/>
  <text x="746" y="282" font-size="13" font-weight="700" fill="#334155">292</text>
  <text x="654" y="318" font-size="13" font-weight="700" fill="#0f766e">157（−46.2%）</text>

  <!-- Qwen 调用 -->
  <text x="540" y="356" font-size="12" fill="#475569">Qwen 调用（baseline 为可观测下限）</text>
  <rect x="540" y="366" width="30" height="26" fill="#94a3b8" rx="4"/>
  <rect x="540" y="402" width="90" height="26" fill="#0d9488" rx="4"/>
  <text x="576" y="384" font-size="13" font-weight="700" fill="#334155">1</text>
  <text x="636" y="420" font-size="13" font-weight="700" fill="#0f766e">17（真实视觉调用全留痕）</text>

  <!-- Verdict -->
  <rect x="540" y="448" width="200" height="34" rx="17" fill="#dcfce7" stroke="#16a34a"/>
  <text x="640" y="470" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">Verdict: PASS（v2）</text>
  <text x="756" y="470" font-size="11" fill="#475569">六项 PASS 条件逐条满足；由 v2 实测计算，未预设</text>

  <!-- 历史链 -->
  <rect x="48" y="440" width="440" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="62" y="458" font-size="11" font-weight="700" fill="#0f172a">历史链（完整保留，不得只展示最终 PASS）</text>
  <text x="62" y="476" font-size="11" fill="#475569">① Initial PARTIAL → ② E9 Remediation → ③ Evaluator v1 误报发现 → ④ v2 全量重评分 PASS</text>

  <!-- 限制 -->
  <text x="48" y="520" font-size="11" fill="#b91c1c">限定：每侧 9 任务、单次完整运行、冻结媒体；不构成统计显著性，不外推为生产性能或真实仓储准确率。</text>
</svg>
